<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Radio Stream Offscreen</title>
    <style>
      body {
        align-items: center;
        background: #101820;
        color: #f7f1e5;
        display: flex;
        font-family: sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      button {
        background: #e31b23;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Radio Stream</h1>
      <p id="status">Lecteur prêt</p>
      <button id="stop" type="button" disabled>Stop</button>
    </main>
    <script src="offscreen.js"></script>
  </body>
</html>
