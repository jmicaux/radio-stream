<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio Stream</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="sidebar">
    <main class="panel">
      <div class="toolbar">
        <h1 class="sr-only">Radio Stream</h1>
        <span class="brand-tagline">Radios en direct</span>
        <button class="version-badge" id="version" type="button" aria-haspopup="dialog" aria-expanded="false" title="Voir les nouveautés"></button>
        <button class="refresh" id="refresh" type="button" aria-label="Rafraîchir la liste des radios" title="Rafraîchir">
          <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </button>
      </div>
      <div class="nowplaying" id="nowplaying" hidden>
        <span class="np-dot" aria-hidden="true"></span>
        <span class="np-status" id="status" aria-live="polite"></span>
        <button class="np-stop" id="stop" type="button" aria-label="Arrêter la lecture" title="Arrêter">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
      </div>
      <div class="stations" id="stations" aria-label="Radios"></div>
    </main>

    <div class="changelog-overlay" id="changelog" hidden>
      <div class="changelog-dialog" role="dialog" aria-modal="true" aria-labelledby="changelog-title">
        <div class="changelog-head">
          <h2 class="changelog-title" id="changelog-title">Nouveautés</h2>
          <button class="changelog-close" id="changelog-close" type="button" aria-label="Fermer">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="changelog-body" id="changelog-body"></div>
      </div>
    </div>

    <script src="sidebar.js"></script>
  </body>
</html>
